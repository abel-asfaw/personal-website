<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Abel Asfaw is a UI software engineer. Follow the route through the places he's worked, the apps he's built and the tools he uses."
    />
    <title>Abel Asfaw</title>
    <link rel="icon" href="/assets/images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.ctfassets.net" crossorigin />
    <link rel="preconnect" href="https://cdn.contentful.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap"
    />
    <script>
      // Apply a saved Day/Night choice before first paint (see useTheme).
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'day' || theme === 'night') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
